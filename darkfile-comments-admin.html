<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدیریت نظرات — DarkFile</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090b14; --bg2:#111425; --panel:#171a2e; --panel2:#1f243f;
  --paper:#efe6cf; --blood:#8a1f2b; --blood-light:#d93848;
  --gold:#d1a13a; --gold-light:#f0c665;
  --text:#ece6d6; --text-dim:#9d9ba8; --text-faint:#605e75;
  --ok:#48bb78; --warn:#ecc94b; --line:rgba(255,255,255,0.08);
  --shadow:0 10px 30px rgba(0,0,0,0.5);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{background:var(--bg); color:var(--text); font-family:'Vazirmatn',sans-serif; line-height:1.7; overflow-x:hidden;}
.wrap{max-width:1100px; margin:0 auto; padding:0 28px;}
a{color:inherit; text-decoration:none;}
.num{font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:isolate;}

.nav{position:sticky; top:0; z-index:50; background:rgba(9,11,20,.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--line);}
.nav .wrap{display:flex; align-items:center; justify-content:space-between; height:70px;}
.brand{font-weight:900; font-size:18px; display:flex; align-items:center; gap:8px;}
.brand b{color:var(--blood-light);}
.brand span{color:var(--gold-light); font-weight:700; font-size:11px; margin-right:6px; background:rgba(209,161,58,.12); padding:4px 12px; border-radius:999px; border:1px solid rgba(209,161,58,.2);}
.nav-right{display:flex; gap:12px; align-items:center;}
.btn{display:inline-flex; align-items:center; gap:8px; padding:9px 18px; border-radius:8px; font-size:12.5px; font-weight:700; cursor:pointer; border:1px solid var(--line); background:var(--bg2); color:var(--text); font-family:inherit; transition:all 0.2s;}
.btn:hover{border-color:var(--gold); transform:translateY(-1px); box-shadow:0 4px 12px rgba(209,161,58,0.15);}
.btn:disabled{opacity:.5; cursor:not-allowed; transform:none;}
.btn-gold{background:linear-gradient(135deg, var(--gold), #b88825); color:#1a1405; border-color:var(--gold); font-weight:800;}
.btn-blood{background:linear-gradient(135deg, var(--blood), var(--blood-light)); color:#fff; border-color:var(--blood-light);}
.btn-xs{padding:6px 12px; font-size:11.5px;}

main{padding:36px 0 80px;}
.gate{min-height:70vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; text-align:center;}
.gate h2{font-size:22px; font-weight:800;}
.gate p{color:var(--text-dim); font-size:13.5px; max-width:420px;}

h2.section-title{font-size:17px; font-weight:800; margin:0 0 18px; display:flex; align-items:center; gap:12px;}
h2.section-title .tag{font-size:11px; font-weight:700; color:var(--gold-light); text-transform:uppercase; letter-spacing:1px; background:rgba(209,161,58,.1); padding:4px 12px; border-radius:999px; border:1px solid rgba(209,161,58,.2);}

.controls-bar{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:16px; flex-wrap:wrap;}
.search-bar{display:flex; gap:10px; flex:1; max-width:400px;}
.search-bar input{width:100%; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:11px 16px; color:var(--text); font-family:'Vazirmatn'; font-size:13px;}
.search-bar input:focus{outline:none; border-color:var(--gold); box-shadow:0 0 10px rgba(209,161,58,0.2);}

.card{background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:var(--shadow);}
.table-wrap{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:13px;}
th,td{padding:14px 18px; text-align:right; border-bottom:1px solid var(--line); vertical-align:top;}
th{color:var(--text-faint); font-weight:700; font-size:11.5px; position:sticky; top:0; background:var(--panel2);}
tbody tr{transition:background 0.2s;}
tbody tr:hover{background:rgba(255,255,255,.03);}
tbody tr.removing{opacity:.3;}
.c-name{font-weight:700; white-space:nowrap;}
.c-msg{color:var(--text-dim); line-height:1.7; max-width:460px; white-space:pre-wrap; word-break:break-word;}
.c-time{color:var(--text-faint); font-size:11.5px; white-space:nowrap;}

.tabs{display:flex; gap:8px; margin-bottom:16px;}
.tab-btn{background:var(--panel); border:1px solid var(--line); color:var(--text-dim); padding:9px 18px; border-radius:8px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit;}
.tab-btn.active{background:var(--gold); color:#1a1405; border-color:var(--gold);}
.status-chip{font-size:10px; font-weight:700; padding:3px 10px; border-radius:999px; display:inline-block; margin-top:4px;}
.status-chip.pending{color:var(--warn); background:rgba(236,201,75,.12); border:1px solid rgba(236,201,75,.3);}
.status-chip.approved{color:var(--ok); background:rgba(72,187,120,.12); border:1px solid rgba(72,187,120,.3);}
.reply-hint{font-size:11px; color:var(--text-faint); margin-top:4px;}

.loading, .empty-note{padding:50px; text-align:center; color:var(--text-faint); font-size:13.5px;}
</style>
</head>
<body>

<div class="nav">
  <div class="wrap">
    <div class="brand">Dark<b>File</b><span>مدیریت نظرات</span></div>
    <div class="nav-right">
      <a class="btn" href="index.html">بازگشت به سایت</a>
      <button class="btn btn-blood" id="logoutBtn" style="display:none;">خروج</button>
    </div>
  </div>
</div>

<main class="wrap">

  <div id="gateView" class="gate" style="display:none;">
    <h2 id="gateTitle">در حال بررسی سطح دسترسی...</h2>
    <p id="gateMsg"></p>
    <div id="gateLoginForm" style="display:none; flex-direction:column; gap:12px; width:100%; max-width:320px; margin-top:14px;">
      <input type="email" id="gateEmail" placeholder="ایمیل مدیریتی (Admin)" autocomplete="off" style="background:var(--bg2); border:1px solid var(--line); border-radius:8px; padding:12px 16px; color:var(--text); font-family:'Vazirmatn'; font-size:13.5px;">
      <input type="password" id="gatePass" placeholder="رمز عبور" autocomplete="off" style="background:var(--bg2); border:1px solid var(--line); border-radius:8px; padding:12px 16px; color:var(--text); font-family:'Vazirmatn'; font-size:13.5px;">
      <button class="btn btn-gold" id="gateLoginBtn">ورود به پنل مدیریت نظرات</button>
      <div id="gateLoginErr" style="display:none; color:var(--blood-light); font-size:12.5px; text-align:center; font-weight:600;"></div>
    </div>
  </div>

  <div id="dashView" style="display:none;">
    <div class="tabs">
      <button class="tab-btn active" data-filter="pending" id="tabPending">در انتظار تایید</button>
      <button class="tab-btn" data-filter="approved" id="tabApproved">تاییدشده</button>
      <button class="tab-btn" data-filter="all" id="tabAll">همه</button>
    </div>
    <div class="controls-bar">
      <h2 class="section-title">نظرات <span class="tag" id="commentCountTag"></span></h2>
      <div class="search-bar">
        <input type="text" id="commentSearch" placeholder="جستجو در اسم یا متن نظر...">
      </div>
    </div>
    <div class="card table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:140px;">اسم</th>
            <th>متن نظر / وضعیت</th>
            <th style="width:140px;">زمان ثبت</th>
            <th style="width:160px;">عملیات</th>
          </tr>
        </thead>
        <tbody id="commentTableBody"></tbody>
      </table>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://uohetpzmscuqdiwibqci.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_CukVAlNn7Nvrx5v_gu7atg_JDcw2dzW';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const gateView = document.getElementById('gateView');
const dashView = document.getElementById('dashView');
const gateTitle = document.getElementById('gateTitle');
const gateMsg = document.getElementById('gateMsg');
const gateLoginForm = document.getElementById('gateLoginForm');
const gateLoginBtn = document.getElementById('gateLoginBtn');
const gateLoginErr = document.getElementById('gateLoginErr');
const logoutBtn = document.getElementById('logoutBtn');
const tbody = document.getElementById('commentTableBody');
const commentCountTag = document.getElementById('commentCountTag');
const searchInput = document.getElementById('commentSearch');

let allComments = [];
let commentById = {};
let activeFilter = 'pending';

const tabButtons = {
  pending: document.getElementById('tabPending'),
  approved: document.getElementById('tabApproved'),
  all: document.getElementById('tabAll')
};
Object.entries(tabButtons).forEach(([key, btn]) => {
  btn.addEventListener('click', () => {
    activeFilter = key;
    Object.values(tabButtons).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    paintTable();
  });
});

function showGate(title, msg, showLoginForm){
  gateView.style.display = 'flex';
  dashView.style.display = 'none';
  gateTitle.textContent = title;
  gateMsg.textContent = msg;
  gateLoginForm.style.display = showLoginForm ? 'flex' : 'none';
}

gateLoginBtn.addEventListener('click', async ()=>{
  const email = document.getElementById('gateEmail').value.trim();
  const pass = document.getElementById('gatePass').value;
  gateLoginErr.style.display = 'none';
  if(!email || !pass){
    gateLoginErr.textContent = 'لطفا ایمیل و رمز عبور را وارد کنید.';
    gateLoginErr.style.display = 'block';
    return;
  }
  gateLoginBtn.disabled = true;
  gateLoginBtn.textContent = 'در حال احراز هویت...';
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  gateLoginBtn.disabled = false;
  gateLoginBtn.textContent = 'ورود به پنل مدیریت نظرات';
  if(error){
    gateLoginErr.textContent = error.message === 'Invalid login credentials' ? 'ایمیل یا رمز عبور اشتباه است.' : error.message;
    gateLoginErr.style.display = 'block';
    return;
  }
  await init();
});

document.getElementById('gatePass').addEventListener('keydown', e=>{ if(e.key==='Enter') gateLoginBtn.click(); });
logoutBtn.addEventListener('click', async ()=>{ await sb.auth.signOut(); location.reload(); });

async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){
    showGate('ورود به سیستم مدیریتی', 'دسترسی به مدیریت نظرات تنها برای اکانت‌های مدیریتی تعریف شده است.', true);
    return;
  }

  const { data: myProfile, error: profErr } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();

  if(profErr){
    showGate('خطای RLS یا دیتابیس', 'پیام خطا: ' + profErr.message, false);
    return;
  }
  if(!myProfile){
    showGate('پروفایل یافت نشد', 'حساب کاربر در جدول profiles موجود نیست.', false);
    return;
  }
  if(myProfile.is_admin !== true){
    showGate('عدم داشتن سطح دسترسی (Admin Access)', 'اکانت شما مجوز ورود به این صفحه را ندارد.', false);
    return;
  }

  logoutBtn.style.display = 'inline-flex';
  await loadComments();
}

function timeAgo(dateStr){
  const diffMs = Date.now() - new Date(dateStr).getTime();
  const mins = Math.floor(diffMs / 60000);
  if(mins < 1) return 'همین الان';
  if(mins < 60) return `${mins} دقیقه پیش`;
  const hrs = Math.floor(mins / 60);
  if(hrs < 24) return `${hrs} ساعت پیش`;
  const days = Math.floor(hrs / 24);
  if(days < 30) return `${days} روز پیش`;
  return new Date(dateStr).toLocaleDateString('fa-IR');
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function loadComments(){
  gateView.style.display = 'none';
  dashView.style.display = 'block';
  tbody.innerHTML = `<tr><td colspan="4"><div class="loading">در حال بارگذاری نظرات...</div></td></tr>`;

  const { data, error } = await sb.from('comments').select('*').order('created_at', { ascending: false });

  if(error){
    tbody.innerHTML = `<tr><td colspan="4"><div class="loading">خطا در بارگذاری: ${escapeHtml(error.message)}</div></td></tr>`;
    return;
  }

  allComments = data || [];
  commentById = {};
  allComments.forEach(c => commentById[c.id] = c);
  commentCountTag.textContent = `${allComments.length} نظر`;
  paintTable();
}

function paintTable(){
  const q = (searchInput.value || '').trim().toLowerCase();
  let rows = allComments.filter(c =>
    c.name.toLowerCase().includes(q) || c.message.toLowerCase().includes(q)
  );
  if(activeFilter === 'pending') rows = rows.filter(c => !c.approved);
  if(activeFilter === 'approved') rows = rows.filter(c => c.approved);

  commentCountTag.textContent = `${rows.length} نظر`;

  tbody.innerHTML = rows.map(c => {
    const parent = c.parent_id ? commentById[c.parent_id] : null;
    const replyHint = parent
      ? `<div class="reply-hint">↪ پاسخ به «${escapeHtml(parent.name)}»: ${escapeHtml((parent.message || '').slice(0, 60))}${parent.message && parent.message.length > 60 ? '…' : ''}</div>`
      : '';
    const statusChip = c.approved
      ? `<span class="status-chip approved">تاییدشده</span>`
      : `<span class="status-chip pending">در انتظار تایید</span>`;
    const approveBtn = c.approved
      ? ''
      : `<button class="btn btn-gold btn-xs" data-approve="${c.id}">تایید</button>`;

    return `
    <tr id="row-${c.id}">
      <td class="c-name">${escapeHtml(c.name)}${c.badge_number ? `<div class="reply-hint num">${escapeHtml(c.badge_number)}</div>` : ''}</td>
      <td class="c-msg">${escapeHtml(c.message)}${replyHint}${statusChip}</td>
      <td class="c-time num">${timeAgo(c.created_at)}</td>
      <td style="display:flex; gap:8px; flex-wrap:wrap;">
        ${approveBtn}
        <button class="btn btn-blood btn-xs" data-id="${c.id}">حذف</button>
      </td>
    </tr>`;
  }).join('') || `<tr><td colspan="4"><div class="empty-note">نظری با این مشخصات پیدا نشد.</div></td></tr>`;

  tbody.querySelectorAll('button[data-id]').forEach(btn=>{
    btn.addEventListener('click', () => deleteComment(btn.dataset.id, btn));
  });
  tbody.querySelectorAll('button[data-approve]').forEach(btn=>{
    btn.addEventListener('click', () => approveComment(btn.dataset.approve, btn));
  });
}

async function approveComment(id, btn){
  btn.disabled = true;
  btn.textContent = '...';
  const { error } = await sb.from('comments').update({ approved: true }).eq('id', id);
  if(error){
    alert('تایید ناموفق بود: ' + error.message);
    btn.disabled = false;
    btn.textContent = 'تایید';
    return;
  }
  const c = commentById[id];
  if(c) c.approved = true;
  paintTable();
}

async function deleteComment(id, btn){
  if(!confirm('این نظر برای همیشه حذف بشه؟')) return;
  btn.disabled = true;
  btn.textContent = '...';
  const { error } = await sb.from('comments').delete().eq('id', id);
  if(error){
    alert('حذف ناموفق بود: ' + error.message);
    btn.disabled = false;
    btn.textContent = 'حذف';
    return;
  }
  allComments = allComments.filter(c => c.id !== id);
  delete commentById[id];
  const row = document.getElementById(`row-${id}`);
  if(row) row.remove();
  paintTable();
}

searchInput.addEventListener('input', paintTable);

init();
</script>
</body>
</html>
